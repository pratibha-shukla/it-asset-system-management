server:
  port: 8080

spring:
  application:
    name: it-asset-management
  datasource:
    url: jdbc:postgresql://localhost:5432/it_asset_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 25
        org.hibernate.envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: it-asset-management
      auto-offset-reset: latest
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.company.itasset.dto.event"
    topics:
      asset-events:   it.asset.events
      request-events: it.request.events
      alerts:         it.infrastructure.alerts

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-prod}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000
  header: Authorization
  prefix: "Bearer "

app:
  # Cookie Secure flag — must be true behind HTTPS in production so the
  # access/refresh-token cookies are never sent over plain HTTP.
  cookie:
    secure: ${COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.company.itasset: DEBUG
    org.springframework.security: INFO
    org.apache.kafka: WARN

google:
  gemini:
    api-key: ${GOOGLE_API_KEY:AIzaSyAgFWhBrfgWzZJzKIthOjVQCDwmlZcF2Bk}
    model: gemini-flash-latest

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY}
