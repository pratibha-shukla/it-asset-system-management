<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Asset Management System</title>
    <style>
      /* ── WCAG 2.1 AA: visible focus ring for keyboard users ── */
      :focus-visible {
        outline: 3px solid #0d6efd !important;
        outline-offset: 2px !important;
        border-radius: 2px;
      }
      /* Suppress focus ring for mouse users (handled by :focus-visible) */
      :focus:not(:focus-visible) { outline: none; }

      /* ── Skip navigation link ── */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 8px;
        z-index: 99999;
        padding: 8px 16px;
        background: #0d6efd;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        border-radius: 0 0 6px 6px;
        text-decoration: none;
        transition: top 0.15s;
      }
      .skip-link:focus { top: 0; color: #fff; }

      /* ── Visually-hidden utility (screen-reader only) ── */
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- WCAG 2.4.1: skip repetitive navigation -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
