name: Deploy Frontend to S3

on:
  push:
    branches: [main]
    paths: ['frontend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm install
      - run: cd frontend && npm run lint --if-present
      - run: cd frontend && npm test -- --watchAll=false --passWithNoTests
      - run: cd frontend && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: aws s3 sync frontend/dist/ s3://it-asset-fronted --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3H7UYVECRK0M8 --paths "/*"