name: CI

#
# Agile Scope Alignment / GitHub Actions CI/CD:
#   Triggered on every push and pull-request to main.
#   Jobs run in parallel where possible; E2E waits for both build jobs.
#
#   Pipeline stages:
#     1. backend-test  — Maven build + JUnit service tests (H2 in-memory)
#     2. frontend-test — npm install + Vitest component tests
#     3. e2e           — Playwright smoke tests against running dev stack
#     4. build-docker  — Multi-stage Docker builds (on main branch only)
#

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:

  # ── 1. Backend — Maven build + JUnit tests ──────────────────────────────────
  backend-test:
    name: Backend (Java 17 / JUnit)
    runs-on: ubuntu-latest

    services:
      # Kafka not required for unit tests (Mockito mocks KafkaProducerService).
      # Integration tests that need Kafka should use @EmbeddedKafka.
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: itasset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run JUnit tests
        working-directory: backend
        run: mvn -B verify --no-transfer-progress
        env:
          # Unit tests use H2 (src/test/resources/application.yml),
          # so POSTGRES vars are only needed if integration tests are added later.
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_PROFILES_ACTIVE: test

      - name: Publish JUnit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/target/surefire-reports/*.xml

      - name: Upload backend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── 2. Frontend — npm build + Vitest component tests ────────────────────────
  frontend-test:
    name: Frontend (Node ${{ env.NODE_VERSION }} / Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest component tests
        working-directory: frontend
        run: npm test -- --reporter=verbose

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 3. E2E — Playwright smoke tests ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: itasset
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Start Spring Boot backend
        working-directory: backend
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/itasset \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --spring.jpa.hibernate.ddl-auto=create \
            --spring.kafka.bootstrap-servers=localhost:9092 \
            --jwt.secret=ci-test-secret-key-minimum-32-chars &
          echo "Waiting for backend..."
          npx wait-on http://localhost:8080/api/v1/auth/health --timeout 60000 || \
            npx wait-on http://localhost:8080/actuator/health --timeout 30000

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASS:  ${{ secrets.E2E_ADMIN_PASS }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ── 4. Docker build (main branch only) ──────────────────────────────────────
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false          # push: true once registry secrets are configured
          tags: it-asset-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: it-asset-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
